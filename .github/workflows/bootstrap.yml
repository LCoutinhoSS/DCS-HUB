name: Importar codigo-fonte DCS HUB v0.3

on:
  push:
    branches: [main]
    paths:
      - '.dcs-transfer/payload.b64'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair os arquivos da versao 0.3
        run: |
          python - <<'PY'
          import base64, json, lzma, pathlib, shutil
          root = pathlib.Path('.').resolve()
          b64 = ''.join(pathlib.Path('.dcs-transfer/' + f).read_text('ascii').strip() for f in ['payload-part-1.b64', 'payload-part-2.b64', 'payload-part-3.b64', 'payload.b64'])
          files = json.loads(lzma.decompress(base64.b64decode(b64)).decode('utf-8'))
          assert len(files) == 15, "Manifesto inesperado"
          for rel, value in files.items():
              path = (root / rel).resolve()
              assert path.is_relative_to(root) and '.git' not in path.parts, f"Caminho proibido: {rel}"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(value, encoding='utf-8')
          shutil.rmtree('.dcs-transfer')
          print(f"Importados {len(files)} arquivos.")
          PY
      - name: Registrar fontes no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: publicar codigo completo DCS HUB v0.3"
          git push
