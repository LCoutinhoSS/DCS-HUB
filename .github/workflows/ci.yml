name: CI - DCS HUB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes
        run: npm test
      - name: Gerar build
        run: npm run build
      - name: Verificar arquivos da build
        run: test -s dist/index.html
      - name: Salvar build como artefato privado
        uses: actions/upload-artifact@v4
        with:
          name: dcs-hub-build
          path: dist/
          retention-days: 7
